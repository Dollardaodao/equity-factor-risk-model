[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-factor-risk-model"
version = "0.1.0"
description = "Cross-sectional equity factor risk estimation and walk-forward covariance validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
data = ["curl-cffi>=0.10,<1"]

[project.scripts]
equity-risk-demo = "factor_project.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
